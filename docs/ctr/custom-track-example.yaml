# A custom track seed. Requires a client built with custom tracks.
# Any complete package descriptor is accepted: track key (content_id), file pins,
# authored laps and measured capability flags. relic: true also needs
# relic_targets {sapphire, gold, platinum} in ticks (960 per second).
# Optional measured weapon_crates: with box_locations on, a track on a named block
# gets Item Box 1 to min(weapon_crates, 15), seated on its own weapon crates; the
# client counts them and refuses a wrong count.
# Optional measured checkpoints and ai_nav: the LEV's restart point count and AI
# paths; with both, Boss Track Shuffle may race a boss there.
name: CustomPadTest
